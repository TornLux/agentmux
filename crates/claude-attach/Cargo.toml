[package]
name = "claude-attach"
version.workspace = true
edition.workspace = true

[[bin]]
name = "claude-attach"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util", "net", "io-std", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Console",
]
