[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/broker",
    "crates/claude-attach",
    "crates/hook-stop",
    "crates/hook-notification",
    "crates/hook-pretool",
    "crates/hook-posttool",
    "crates/platform-discord",
    "crates/agentmux-cli",
    "crates/agentmux-tray",
]

[workspace.package]
version = "0.3.3"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TornLux/agentmux"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
