name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Required for manual runs."
        required: false
        default: ""

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows

      - name: Build release zip
        shell: pwsh
        run: |
          .\scripts\build-release.ps1
          Get-ChildItem dist\

      - name: Compute SHA256
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\*.zip | Select-Object -First 1
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($zip.Name)" | Out-File -FilePath "dist\$($zip.BaseName).sha256" -Encoding ascii
          Write-Host "sha256: $hash"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux

      - name: Build release tarball
        run: |
          bash scripts/build-release.sh
          ls -la dist/

      - name: Compute SHA256
        run: |
          archive=$(ls dist/*.tar.gz | head -n1)
          hash=$(sha256sum "$archive" | awk '{ print $1 }')
          base=$(basename "$archive" .tar.gz)
          printf "%s  %s\n" "$hash" "$(basename "$archive")" > "dist/${base}.sha256"
          echo "sha256: $hash"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  build-macos:
    # One Apple Silicon runner produces both aarch64 (native) and
    # x86_64 (cross-compiled) tarballs. macos-13 (the old dedicated
    # Intel runner) is avoided because GitHub's Intel runner pool is
    # tiny and routinely queues 30+ minutes; cross-compiling from
    # arm64 is well-supported by Apple's universal SDK and the
    # standard Rust toolchain.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (both Apple targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos
          # Both target dirs (target/aarch64-apple-darwin/ +
          # target/x86_64-apple-darwin/) live under target/ and are
          # cached together by rust-cache's defaults.

      - name: Build aarch64 tarball
        run: TARGET=aarch64-apple-darwin bash scripts/build-release.sh

      - name: Build x86_64 tarball (cross-compiled)
        run: TARGET=x86_64-apple-darwin bash scripts/build-release.sh

      - name: List dist
        run: ls -la dist/

      - name: Compute SHA256 for both archives
        run: |
          for archive in dist/*.tar.gz; do
            hash=$(shasum -a 256 "$archive" | awk '{ print $1 }')
            base=$(basename "$archive" .tar.gz)
            printf "%s  %s\n" "$hash" "$(basename "$archive")" > "dist/${base}.sha256"
            echo "sha256: $hash  $(basename "$archive")"
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # needed to create the GitHub release

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then tag="${{ github.ref_name }}"; fi
          if [ -z "$tag" ]; then echo "no tag provided" >&2; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.sha256' \) \
              -exec cp -v {} release-assets/ \;
          ls -la release-assets/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/*.sha256
